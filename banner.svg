<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Pedro Heitor - Desenvolvedor Fullstack Java e React">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1015"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1a1c"/>
    </linearGradient>

    <radialGradient id="blob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1ABB9C" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1ABB9C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1ABB9C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1ABB9C"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1ABB9C" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#1ABB9C" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <clipPath id="frame">
      <rect width="900" height="230" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="230" fill="url(#bg)"/>
    <rect width="900" height="230" fill="url(#grid)"/>

    <!-- brilho teal deslizando -->
    <ellipse cx="0" cy="115" rx="330" ry="190" fill="url(#blob)">
      <animateTransform attributeName="transform" type="translate"
                        values="120,0; 700,0; 120,0" dur="14s" repeatCount="indefinite"/>
    </ellipse>

    <!-- varredura de luz -->
    <rect x="-300" y="0" width="300" height="230" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate"
                        values="-300,0; 1200,0" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- pipeline de nós à direita: lote -> pesagem -> estoque -> venda -->
    <g transform="translate(596,148)" opacity="0.95">
      <line x1="0" y1="0" x2="66" y2="0" stroke="#1ABB9C" stroke-opacity="0.35" stroke-width="2"/>
      <line x1="66" y1="0" x2="132" y2="0" stroke="#1ABB9C" stroke-opacity="0.35" stroke-width="2"/>
      <line x1="132" y1="0" x2="198" y2="0" stroke="#1ABB9C" stroke-opacity="0.35" stroke-width="2"/>

      <circle cx="0" cy="0" r="6" fill="#0d1117" stroke="#1ABB9C" stroke-width="2">
        <animate attributeName="r" values="6;8;6" dur="3s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="66" cy="0" r="6" fill="#0d1117" stroke="#1ABB9C" stroke-width="2">
        <animate attributeName="r" values="6;8;6" dur="3s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="132" cy="0" r="6" fill="#0d1117" stroke="#38bdf8" stroke-width="2">
        <animate attributeName="r" values="6;8;6" dur="3s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="198" cy="0" r="6" fill="#0d1117" stroke="#38bdf8" stroke-width="2">
        <animate attributeName="r" values="6;8;6" dur="3s" begin="2.1s" repeatCount="indefinite"/>
      </circle>

      <!-- pacote de dados percorrendo o pipeline -->
      <circle cy="0" r="3.5" fill="#38bdf8">
        <animate attributeName="cx" values="0;198" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="4s" repeatCount="indefinite"/>
      </circle>

      <text x="-4" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#7d8590">LOTE</text>
      <text x="48" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#7d8590">PESAGEM</text>
      <text x="112" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#7d8590">ESTOQUE</text>
      <text x="182" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#7d8590">VENDA</text>
    </g>

    <!-- texto -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <text x="56" y="76" font-size="14" letter-spacing="4" fill="#1ABB9C" font-weight="600">
        FULLSTACK DEVELOPER
        <animate attributeName="opacity" values="0;1" dur="1.1s" fill="freeze"/>
      </text>

      <text x="54" y="126" font-size="40" font-weight="700" fill="#e6edf3">
        Pedro Heitor
        <animate attributeName="opacity" values="0;1" dur="1.1s" begin="0.25s" fill="freeze"/>
      </text>

      <text x="56" y="158" font-size="16" fill="#8b949e">
        Java  ·  Spring Boot  ·  React  ·  PostgreSQL
        <animate attributeName="opacity" values="0;1" dur="1.1s" begin="0.5s" fill="freeze"/>
      </text>

      <text x="56" y="186" font-size="13" fill="#6e7681">
        Sistemas de gestao para operacoes reais
        <animate attributeName="opacity" values="0;1" dur="1.1s" begin="0.75s" fill="freeze"/>
      </text>
    </g>

    <!-- régua inferior que se desenha -->
    <rect x="0" y="226" width="900" height="4" fill="url(#rule)">
      <animate attributeName="width" values="0;900" dur="1.8s" fill="freeze"/>
    </rect>

    <rect width="899" height="229" x="0.5" y="0.5" rx="14" fill="none" stroke="#1ABB9C" stroke-opacity="0.25"/>
  </g>
</svg>
