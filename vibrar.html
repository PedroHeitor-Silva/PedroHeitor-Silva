<title>Botão Pulsar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: uma tela só, botão redondo central, padrões de pulso abaixo */
  :root {
    --bg: #f3f1f8; --fg: #1d1a29; --muted: #6b6680; --surface: #ffffff;
    --accent: #6a3df0; --accent-2: #b39cff; --line: #dcd7ea;
    --display: "Space Grotesk", system-ui, sans-serif;
    --body: "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #12101a; --fg: #eeebf7; --muted: #9a94b0; --surface: #1d1a29;
    --accent: #8f6bff; --accent-2: #4a3596; --line: #2e2a3d; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #12101a; --fg: #eeebf7; --muted: #9a94b0; --surface: #1d1a29;
    --accent: #8f6bff; --accent-2: #4a3596; --line: #2e2a3d; color-scheme: dark }

  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--body);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2rem; padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box; -webkit-tap-highlight-color: transparent;
  }
  h1 { font-family: var(--display); font-size: 1.6rem; margin: 0; text-align: center; }
  p.sub { margin: .4rem 0 0; color: var(--muted); text-align: center; }

  .stage { position: relative; width: min(64vw, 260px); aspect-ratio: 1; max-width: 100%; }
  .ring {
    position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--accent);
    opacity: 0; pointer-events: none;
  }
  .on .ring { animation: ripple var(--period, 1s) ease-out infinite; }
  .on .ring:nth-child(2) { animation-delay: calc(var(--period, 1s) / 2); }
  @keyframes ripple { from { transform: scale(1); opacity: .7 } to { transform: scale(1.5); opacity: 0 } }

  #pulse {
    position: absolute; inset: 0; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, var(--accent-2), var(--accent));
    color: #fff; font-family: var(--display); font-size: 1.5rem; font-weight: 700;
    box-shadow: 0 12px 40px color-mix(in srgb, var(--accent) 45%, transparent);
    transition: transform .15s;
  }
  #pulse:active { transform: scale(.96); }
  #pulse:focus-visible { outline: 3px solid var(--fg); outline-offset: 6px; }
  .on #pulse { animation: beat var(--period, 1s) ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1) } 15% { transform: scale(1.08) } 30% { transform: scale(.98) } }

  .modes { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; }
  .modes button {
    font: 600 .95rem var(--body); padding: .6rem 1rem; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
  }
  .modes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modes button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .speed { display: flex; align-items: center; gap: .75rem; width: min(100%, 320px); }
  .speed label { color: var(--muted); font-size: .9rem; white-space: nowrap; }
  .speed input { flex: 1; accent-color: var(--accent); }
  .speed output { font-variant-numeric: tabular-nums; width: 3.5rem; text-align: right; font-size: .9rem; }

  #status { min-height: 1.4em; color: var(--muted); text-align: center; max-width: 34ch; font-size: .9rem; }
  @media (prefers-reduced-motion: reduce) { .on #pulse, .on .ring { animation: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap">

<header>
  <h1>Botão Pulsar</h1>
  <p class="sub">Toque para o celular vibrar no ritmo. Toque de novo para parar.</p>
</header>

<div class="stage" id="stage">
  <span class="ring"></span><span class="ring"></span>
  <button id="pulse" type="button" aria-pressed="false">PULSAR</button>
</div>

<div class="modes" role="group" aria-label="Padrão de vibração">
  <button type="button" data-mode="coracao" aria-pressed="true">Coração</button>
  <button type="button" data-mode="pulso" aria-pressed="false">Pulso</button>
  <button type="button" data-mode="sos" aria-pressed="false">SOS</button>
  <button type="button" data-mode="continuo" aria-pressed="false">Contínuo</button>
</div>

<div class="speed">
  <label for="bpm">Ritmo</label>
  <input id="bpm" type="range" min="40" max="180" value="70">
  <output id="bpmOut" for="bpm">70 bpm</output>
</div>

<p id="status" role="status"></p>

<script>
  const btn = document.getElementById('pulse');
  const stage = document.getElementById('stage');
  const bpm = document.getElementById('bpm');
  const bpmOut = document.getElementById('bpmOut');
  const status = document.getElementById('status');
  const canVibrate = typeof navigator.vibrate === 'function';
  let mode = 'coracao', on = false, timer = null;

  // Cada padrão: [vibra, pausa, vibra, ...] em ms, escalado pelo período de uma batida.
  function pattern(period) {
    switch (mode) {
      case 'coracao': return [Math.round(period*0.12), Math.round(period*0.12), Math.round(period*0.18)];
      case 'pulso':   return [Math.round(period*0.35)];
      case 'sos':     return [150,100,150,100,150,250,400,100,400,100,400,250,150,100,150,100,150];
      case 'continuo':return [Math.round(period)];
    }
  }
  function cycleLength(period) {
    if (mode === 'sos') return 3600;
    return period;
  }
  function tick() {
    const period = 60000 / Number(bpm.value);
    if (canVibrate) navigator.vibrate(pattern(period));
    timer = setTimeout(tick, cycleLength(period));
  }
  function start() {
    on = true; stage.classList.add('on'); btn.setAttribute('aria-pressed', 'true');
    btn.textContent = 'PARAR';
    clearTimeout(timer); tick();
    status.textContent = canVibrate
      ? 'Vibrando… Se nada acontecer, abra esta página direto no navegador (Chrome no Android).'
      : 'Este navegador não permite vibração (o iPhone/Safari não suporta). A animação continua mesmo assim.';
  }
  function stop() {
    on = false; stage.classList.remove('on'); btn.setAttribute('aria-pressed', 'false');
    btn.textContent = 'PULSAR';
    clearTimeout(timer); if (canVibrate) navigator.vibrate(0);
    status.textContent = '';
  }
  function syncPeriod() {
    stage.style.setProperty('--period', (60 / Number(bpm.value)) + 's');
    bpmOut.textContent = bpm.value + ' bpm';
  }

  btn.addEventListener('click', () => on ? stop() : start());
  document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.modes button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    mode = b.dataset.mode;
    if (on) { clearTimeout(timer); tick(); }
  }));
  bpm.addEventListener('input', syncPeriod);
  document.addEventListener('visibilitychange', () => { if (document.hidden && on) stop(); });
  syncPeriod();
</script>
